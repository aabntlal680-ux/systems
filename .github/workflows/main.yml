name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # يتيح تشغيل الـ Workflow يدوياً من تبويب Actions
  workflow_dispatch:

# إعطاء الصلاحيات اللازمة للـ GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# السماح بتشغيل عملية نشر واحدة فقط في نفس الوقت
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configure Pages
        uses: actions/configure-pages@v3
        with:
          enablement: true

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
